<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <title>Screen Buddy</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="panel">
      <header class="bar">
        <span class="dot" id="dot" title="Watching"></span>
        <span class="title">Screen Buddy</span>
        <span class="badge" id="badge" hidden>new</span>
        <span class="spacer"></span>
        <button class="icon text" id="smaller" title="Smaller text (Ctrl -)">A−</button>
        <button class="icon text" id="bigger" title="Bigger text (Ctrl +)">A+</button>
        <button class="icon" id="pause" title="Pause auto check-ins">⏸</button>
        <button class="icon" id="collapse" title="Collapse">▁</button>
        <button class="icon" id="hide" title="Hide (bring back with hotkey)">✕</button>
      </header>

      <div class="controls">
        <label>
          Look every
          <select id="interval">
            <option value="0">never</option>
            <option value="1">1 min</option>
            <option value="2">2 min</option>
            <option value="5">5 min</option>
            <option value="10">10 min</option>
            <option value="15">15 min</option>
            <option value="30">30 min</option>
          </select>
        </label>
        <label title="Screenshot size sent to your buddy. Smaller uses less of its memory; larger makes small text easier to read.">
          Detail
          <select id="shotWidth">
            <option value="1024">Low (1024)</option>
            <option value="1280">720p (1280)</option>
            <option value="1568">High (1568)</option>
            <option value="1920">1080p (1920)</option>
          </select>
        </label>
        <button class="link" id="checkNow">Look now</button>
        <button class="link" id="folder">Screenshots</button>
        <span class="spacer"></span>
        <span class="winsize" title="Window size (Ctrl+Shift - / Ctrl+Shift =)">
          <button class="icon small" id="winSmaller" title="Smaller window">−</button>
          ▢
          <button class="icon small" id="winBigger" title="Bigger window">+</button>
        </span>
        <label class="opacity" title="See-through">
          ◐
          <input type="range" id="opacity" min="30" max="100" step="5" />
        </label>
      </div>

      <main class="log" id="log"></main>

      <form class="composer" id="composer">
        <textarea id="input" rows="2" placeholder="Ask about what's on your screen… (Enter to send)"></textarea>
        <button type="submit" id="sendBtn" title="Take a screenshot and send">📸</button>
      </form>
      <div class="footer" id="footer"></div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
